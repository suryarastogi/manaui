name: Release

# Changesets flow: merging a changeset opens (or updates) a "Version Packages"
# PR; merging that PR publishes @manaui/core to npm.
#
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Set it
# up once at npmjs.com → @manaui/core → Settings → Trusted publisher, with
# this repository and workflow file (release.yml). See README "Releasing".
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'suryarastogi/manaui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test -w @manaui/core
      # npm only lets a trusted publisher be configured for a package that
      # already exists, so the very first publish is done by hand. Until
      # then there is nothing for this workflow to do.
      - name: Check the package exists on npm
        id: npm
        run: |
          if npm view @manaui/core version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@manaui/core is not on npm yet. Publish it once by hand (README, Releasing); this workflow takes over after that."
          fi
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: steps.npm.outputs.exists == 'true'
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Version packages
          commit-message: 'chore: version packages'
